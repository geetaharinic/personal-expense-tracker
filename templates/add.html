{% extends "base.html" %}{% block title %}Add transaction · SpendWise{% endblock %}{% block content %}<small>TRANSACTION ENTRY</small><h1>Add a transaction</h1><section class="panel formpanel"><form method="post" class="formgrid"><label>Date<input type="date" name="transaction_date" value="{{ today }}" required></label><label>Type<select name="transaction_type"><option value="expense">Expense</option><option value="income">Income</option></select></label><label>Category<select name="category">{% for c in categories %}<option>{{ c }}</option>{% endfor %}</select></label><label>Amount (₹)<input type="number" name="amount" min="0.01" step="0.01" placeholder="250.00" required></label><label class="full">Description<input name="description" maxlength="200" placeholder="e.g. Lunch, bus fare, allowance" required></label><label>Payment method<select name="payment_method"><option>UPI</option><option>Cash</option><option>Card</option><option>Bank Transfer</option><option>Other</option></select></label><div class="actions"><button>Save transaction</button><a class="button light" href="{{ url_for('dashboard') }}">Cancel</a></div></form></section>{% endblock %}
